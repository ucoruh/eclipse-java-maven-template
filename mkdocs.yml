# MkDocs Material = the MAIN site of this template (same look and menu as the course sites).
# Build:  7-build-all-<platform>  (stages generated pages into docs/, then runs "mkdocs build -d site")
# Edit live:  9-open-site-<platform> --edit
# The Maven site is built separately (mvn site -> site-native/) and published under native/ - it is linked
# from the menu but never framed (see docs/guide/standard.en.md, "Site rules").
site_name: Calculator - Java + Maven course template
site_description: Java 17, Maven, JUnit 5, JaCoCo, ReportGenerator, Doxygen, Javadoc and a full site - the starting point for a term project.
site_url: https://ucoruh.github.io/eclipse-java-maven-template/
repo_url: https://github.com/ucoruh/eclipse-java-maven-template
repo_name: ucoruh/eclipse-java-maven-template
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: RTEU - Dr. Ugur Coruh. Licensed under AGPL-3.0.

theme:
  name: material
  language: en
  logo: assets/rteu_logo.jpg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: warn
  anchors: info

not_in_nav: |
  /archive/

exclude_docs: |
  archive/
  desktop.ini
  **/desktop.ini

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
          site_name: Calculator - Java + Maven course template
        - locale: tr
          name: Türkçe
          build: true
          site_name: Calculator - Java + Maven ders şablonu
          nav_translations:
            Home: Ana sayfa
            Guide: Kılavuz
            Install the tools: Araçları kurun
            Use the template: Şablonu kullanın
            From a project topic to your project: Proje konusundan kendi projenize
            Daily workflow and reports: Günlük çalışma ve raporlar
            Showing your project without GitHub Pages: GitHub Pages olmadan projenizi gösterin
            Releases and private repositories: Sürümler ve özel depolar
            Naming standard and site rules: Adlandırma standardı ve site kuralları
            Toolchain comparison: Araç zinciri karşılaştırması
            Troubleshooting: Sorun giderme
            Reports: Raporlar
            Overview: Genel bakış
            Which report is which?: Hangi rapor hangisi?
            Unit tests (junit2html): Birim testleri (junit2html)
            Coverage - JaCoCo: Kapsama - JaCoCo
            Coverage - ReportGenerator: Kapsama - ReportGenerator
            Doc coverage - genhtml: Dokümantasyon kapsaması - genhtml
            Doc coverage - ReportGenerator: Dokümantasyon kapsaması - ReportGenerator
            API docs: API belgeleri
            Doxygen: Doxygen
            Javadoc: Javadoc
            Test Javadoc: Test Javadoc
            Source Xref (JXR): Kaynak çapraz başvurusu (JXR)
            Test Source Xref (JXR): Test kaynağı çapraz başvurusu (JXR)
            Downloads: İndirmeler
            Maven site (native): Maven sitesi (native)

nav:
  - Home: index.md
  - Guide:
      - Install the tools: guide/install.md
      - Use the template: guide/use-template.md
      - From a project topic to your project: guide/from-topic.md
      - Daily workflow and reports: guide/workflow.md
      - Showing your project without GitHub Pages: guide/showcase.md
      - Releases and private repositories: guide/releases.md
      - Naming standard and site rules: guide/standard.md
      - Toolchain comparison: guide/toolchain-comparison.md
      - Troubleshooting: guide/troubleshooting.md
  - Reports:
      - Overview: reports/index.md
      - Which report is which?: guide/which-report.md
      - Windows:
          - Overview: reports/windows/index.md
          - Unit tests (junit2html): reports/windows/tests-junit2html/index.md
          - Coverage - JaCoCo: reports/windows/coverage-jacoco/index.md
          - Coverage - ReportGenerator: reports/windows/coverage-reportgenerator/index.md
          - Doc coverage - genhtml: reports/windows/doccoverage-lcov/index.md
          - Doc coverage - ReportGenerator: reports/windows/doccoverage-reportgenerator/index.md
      - Linux:
          - Overview: reports/linux/index.md
          - Unit tests (junit2html): reports/linux/tests-junit2html/index.md
          - Coverage - JaCoCo: reports/linux/coverage-jacoco/index.md
          - Coverage - ReportGenerator: reports/linux/coverage-reportgenerator/index.md
          - Doc coverage - genhtml: reports/linux/doccoverage-lcov/index.md
          - Doc coverage - ReportGenerator: reports/linux/doccoverage-reportgenerator/index.md
  - API docs:
      - Overview: api.md
      - Windows:
          - Doxygen: reports/windows/api-doxygen/index.md
          - Javadoc: reports/windows/api-javadoc/index.md
          - Test Javadoc: reports/windows/api-testjavadoc/index.md
          - Source Xref (JXR): reports/windows/api-xref-jxr/index.md
          - Test Source Xref (JXR): reports/windows/api-xreftest-jxr/index.md
      - Linux:
          - Doxygen: reports/linux/api-doxygen/index.md
          - Javadoc: reports/linux/api-javadoc/index.md
          - Test Javadoc: reports/linux/api-testjavadoc/index.md
          - Source Xref (JXR): reports/linux/api-xref-jxr/index.md
          - Test Source Xref (JXR): reports/linux/api-xreftest-jxr/index.md
