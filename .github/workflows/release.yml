name: Release

# Full pipeline: build, both coverage-report families, both doc-coverage
# families, API docs (Javadoc + Doxygen), Maven site, then a GitHub Release
# with everything attached. This is the CI alternative to running
# 10-release.bat / 10-release.sh locally (see docs/guide/releases-en.md).
#
# It only runs on a version tag push or a manual dispatch - never on every
# push/PR - so it does not eat into GitHub Actions' free minutes
# (2,000 min/month on Free, 3,000 on Pro) on routine commits. A typical run
# takes roughly 4-6 minutes (Maven build+test, Doxygen, ReportGenerator,
# coverxygen/genhtml, mvn site).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: >
          Also deploy target/site to GitHub Pages. Only works if Pages is
          enabled on this repo - on a private repo that needs GitHub
          Pro/Team (or the free Student Developer Pack). See
          docs/guide/releases-en.md.
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    name: Build, package reports, create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up .NET (for the ReportGenerator global tool)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python (for coverxygen)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native tools (doxygen, lcov/genhtml, zip)
        run: sudo apt-get update && sudo apt-get install -y doxygen lcov zip

      - name: Install coverxygen
        run: python3 -m pip install --user coverxygen

      - name: Install the ReportGenerator global tool
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Put dotnet tools and the pip user base on PATH
        run: |
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Build, test, generate every report and the site
        run: |
          chmod +x 7-build-app.sh
          ./7-build-app.sh

      - name: Zip the site (release/site.zip)
        run: |
          rm -f release/site.zip
          (cd calculator-app/target/site && zip -rq ../../../release/site.zip .)

      - name: Create GitHub Release with every report attached
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      - name: Deploy site to GitHub Pages (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./calculator-app/target/site
