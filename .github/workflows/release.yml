name: Release

# Full pipeline: build, both coverage-report families, both doc-coverage
# families, API docs (Javadoc + Doxygen), the Maven site (landing page +
# every report in its own iframe page), then a GitHub Release with every
# report attached as its own clearly named asset. This is the CI
# alternative to running 10-release.bat / 10-release.sh locally (see
# docs/guide/releases-en.md). Publishing the live site itself is a separate
# workflow (pages.yml), which runs on every push to main.
#
# It only runs on a version tag push or a manual dispatch - never on every
# push/PR - so it does not eat into GitHub Actions' free minutes
# (2,000 min/month on Free, 3,000 on Pro) on routine commits. A typical run
# takes roughly 4-6 minutes (Maven build+test, Doxygen, ReportGenerator,
# coverxygen/genhtml, mvn site). Releases work the same on a private repo on
# GitHub Free (unlike Pages, which needs Pro - see docs/guide/releases-en.md).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >
          Version to release, e.g. v1.2.3 (only used for a manual run -
          ignored when triggered by a tag push, which uses the tag itself).
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, package reports, create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "::error::workflow_dispatch needs a non-empty 'version' input, e.g. v1.2.3." >&2
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up .NET (for the ReportGenerator global tool)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python (for coverxygen)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native tools (doxygen, lcov/genhtml, zip)
        run: sudo apt-get update && sudo apt-get install -y doxygen lcov zip

      - name: Install coverxygen
        run: python3 -m pip install --user coverxygen

      - name: Install the ReportGenerator global tool
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Put dotnet tools and the pip user base on PATH
        run: |
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Build, test, generate every report and the site
        run: |
          chmod +x 7-build-app.sh
          ./7-build-app.sh

      - name: Zip the site (release/site.zip)
        run: |
          rm -f release/site.zip
          (cd calculator-app/target/site && zip -rq ../../../release/site.zip .)
          echo '| `site.zip` | The full Maven site, zipped - unzip and open `index.html` (this is how a private-repo release ships the site without GitHub Pages; see `docs/guide/releases-en.md`) |' >> release/README.md

      - name: Build the release notes body (links the live site + every report page)
        id: notes
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/$(basename "${{ github.repository }}")"
          {
            echo "Live site: $SITE/"
            echo ""
            echo "Built by \`7-build-app.sh\` (\`.github/workflows/release.yml\`) - see \`docs/guide/releases-en.md\` for"
            echo "what each asset is and how to open it (also in \`release/README.md\`, attached below). This Java"
            echo "template's runnable jar is portable bytecode: the single \`application-binary.tar.gz\` runs unmodified"
            echo "on Windows, Linux and macOS with any JDK 17+."
            echo ""
            echo "### Reports, on the live site"
            echo ""
            echo "- [Landing page]($SITE/)"
            echo "- [Which report is which?]($SITE/tool-catalog.html)"
            echo "- [Unit tests: Surefire]($SITE/surefire.html)"
            echo "- [Coverage: JaCoCo (native)]($SITE/reports/jacoco.html)"
            echo "- [Coverage: ReportGenerator]($SITE/reports/coveragereport.html)"
            echo "- [Doc coverage: genhtml (native)]($SITE/reports/coverxygen.html)"
            echo "- [Doc coverage: ReportGenerator]($SITE/reports/coverxygen-reportgenerator.html)"
            echo "- [API docs: Javadoc (native)]($SITE/reports/javadoc.html)"
            echo "- [API docs: Doxygen]($SITE/reports/doxygen.html)"
            echo "- [Code quality: Checkstyle]($SITE/checkstyle.html)"
            echo "- [Code quality: PMD]($SITE/pmd.html)"
            echo "- [Code quality: CPD]($SITE/cpd.html)"
            echo "- [Code quality: SpotBugs]($SITE/spotbugs.html)"
          } > "$RUNNER_TEMP/release-notes.md"
          {
            echo "body<<NOTESEOF"
            cat "$RUNNER_TEMP/release-notes.md"
            echo "NOTESEOF"
          } >> "$GITHUB_OUTPUT"

      - name: List release assets in the step summary
        run: |
          {
            echo "## Release ${{ steps.version.outputs.version }}"
            echo ""
            echo "Site (once Pages has deployed this commit): https://${{ github.repository_owner }}.github.io/$(basename "${{ github.repository }}")/"
            echo ""
            echo "### Assets"
            echo ""
            for f in release/*; do
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release with every report attached
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: release/*
          generate_release_notes: true
          body: ${{ steps.notes.outputs.body }}
